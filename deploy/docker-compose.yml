services:
  gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      - KEY=${KEY}
      - URL=${URL}
      - MODEL=${MODEL}
      - OTEL_ENABLED=${OTEL_ENABLED:-0}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    depends_on:
      - redis
      - mysql
    restart: unless-stopped

  worker:
    build: .
    # 多节点水平扩展示例：同一镜像、无状态 Worker（当前 MVP 与 gateway 同进程承担）
    command: ["python", "-m", "trpc_service.web.app"]
    environment:
      - KEY=${KEY}
      - URL=${URL}
      - MODEL=${MODEL}
    depends_on:
      - redis
      - mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me}
      MYSQL_DATABASE: trpc_agent
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-config.yaml"]
    volumes:
      - ./deploy/otel-config.yaml:/etc/otel-config.yaml:ro
    ports:
      - "4318:4318"
    restart: unless-stopped

volumes:
  redis-data:
  mysql-data:
